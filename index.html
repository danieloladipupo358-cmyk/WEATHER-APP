<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="card">

        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city name" spellcheck="false">
            <button id="searchButton">
                <img src="images/search.png" alt="Search">
            </button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="weather">

            <img src="images/clear.png" class="weather-icon" id="weatherIcon">

            <h1 class="temp" id="temperature">--°C</h1>

            <h2 class="city" id="city">City</h2>

            <div class="details">

                <div class="col">
                    <img src="images/humidity.png" alt="Humidity">
                    <div>
                        <p class="humidity" id="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/wind.png" alt="Wind">
                    <div>
                        <p class="wind" id="wind">-- km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="JS/script.js"></script>

</body>
</html>
